name: Deploy website to Hostinger (SFTP over SSH)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p deploy
          find . -maxdepth 1 -type f -name '*.html' -exec cp -t deploy/ {} +
          test -f deploy/index.html

      - name: Check SSH deployment secrets
        shell: bash
        env:
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: |
          test -n "$SSH_PASSWORD"
          test -n "$SSH_FINGERPRINT"
          case "$SSH_FINGERPRINT" in SHA256:*) ;; *) echo 'Host-key fingerprint must start with SHA256:'; exit 1 ;; esac

      - name: Install SSH deployment utility
        run: sudo apt-get install -y -qq sshpass

      - name: Verify Hostinger SSH host key
        shell: bash
        env:
          SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 65002 -t ed25519 147.93.54.140 > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          if [ "$actual" != "$SSH_FINGERPRINT" ]; then
            echo 'Host SSH fingerprint mismatch. Stopping deployment.'
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish website to Hostinger via SSH
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rvz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -p 65002 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            deploy/ u576784635@147.93.54.140:/home/u576784635/domains/itec-ai.com/public_html/
