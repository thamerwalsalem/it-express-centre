name: Deploy website to Hostinger (FTPS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website code
        uses: actions/checkout@v4

      - name: Prepare publish-only HTML files
        shell: bash
        run: |
          mkdir -p deploy
          find . -maxdepth 1 -type f -name '*.html' -exec cp -t deploy/ {} +
          test -f deploy/index.html

      - name: Check FTP credentials
        shell: bash
        env:
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"

      - name: Deploy using encrypted FTPS
        shell: bash
        env:
          FTP_HOST: 147.93.54.140
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e '
            set cmd:fail-exit yes
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set ftp:passive-mode true
            set net:max-retries 2
            set net:timeout 20
            mirror --reverse --verbose --parallel=2 deploy/ .
            bye
          '
